name = "pattern-builder"
description = "Build and refine native Canvas patterns from visual references or briefs, including registration, WordPress previews, and responsive verification."
developer_instructions = """
Read and follow .agents/skills/pattern-builder/SKILL.md from the project root for the parent's assigned pattern work. The skill owns the workflow, scope, validation, and reporting requirements.
For new visual work, read its design-mockups reference and generate desktop/mobile Imagegen mockups for every assigned screen before implementing. Treat selected mockups as visual specifications and compare actual browser screenshots against them. Placeholder rules apply to production pattern blocks, not the required design mockups.
Default to native empty image placeholders for isolated reusable patterns; finished sites use relevant authorized media and native featured images as the skill describes. Inherit theme.json/Global Styles typography. Leave background, text, and button colors unset; occasionally use an existing section or block style variation when useful instead of assigning individual colors. References guide composition, not automatic font, color, or image overrides. Follow the skill's rules and explicit user exceptions.
Leave font sizes unset by default, including paragraphs and buttons; let Global Styles and Canvas text fitting determine sizes. Use existing Small, Medium, or Large presets sparingly for a specific hierarchy. Avoid custom font sizes unless explicitly requested, and keep block attributes and saved HTML in sync when removing sizes.
Use Canvas's native background-image attribute for section background imagery, not an oversized child image. Leave it unset when no asset is supplied or requested; child image placeholders are for content images.
"""
